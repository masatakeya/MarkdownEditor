<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdownエディタ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@400;500&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">

<style id="tokens">
:root{
  --bg:#E6E9ED;
  --sheet:#FCFCFD;
  --pane:#F3F4F6;
  --ink:#1E2733;
  --muted:#5B6776;
  --rule:#C6CDD6;
  --accent:#31438A;
  --accent-soft:#E3E7F4;
  --code:#E8EBF0;
  --ui:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,system-ui,sans-serif;
  --serif:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --mono:"M PLUS 1 Code","SFMono-Regular",Consolas,"Hiragino Sans",monospace;
}
</style>

<style id="article-css">
.article{font-family:var(--serif);font-size:16px;line-height:1.95;color:var(--ink);overflow-wrap:anywhere}
.article > :first-child{margin-top:0}
.article h1,.article h2,.article h3,.article h4{line-height:1.5;font-weight:700;margin:2em 0 .6em}
.article h1{font-size:1.7em}
.article h2{font-size:1.35em;padding-bottom:.25em;border-bottom:1px solid var(--rule)}
.article h3{font-size:1.15em}
.article h4{font-size:1em}
.article p{margin:0 0 1.1em}
.article ul,.article ol{padding-left:1.6em;margin:0 0 1.1em}
.article li{margin:.2em 0}
.article blockquote{margin:1.2em 0;padding:.1em 1.2em;border-left:3px solid var(--accent);background:var(--accent-soft);color:#2A3550}
.article blockquote p{margin:.6em 0}
.article code{font-family:var(--mono);font-size:.88em;background:var(--code);padding:.1em .35em;border-radius:3px}
.article pre{background:var(--code);padding:14px 16px;border-radius:4px;overflow-x:auto;line-height:1.6;margin:0 0 1.2em}
.article pre code{background:none;padding:0;font-size:.85em}
.article table{border-collapse:collapse;display:block;max-width:100%;overflow-x:auto;margin:0 0 1.2em}
.article th,.article td{border:1px solid var(--rule);padding:.4em .8em;text-align:left}
.article th{background:var(--code)}
.article img{max-width:100%;height:auto}
.article hr{border:0;border-top:1px solid var(--rule);margin:2em 0}
.article a{color:var(--accent);text-underline-offset:.2em}
.article input[type=checkbox]{margin-right:.4em}
</style>

<style id="app-css">
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--ui);color:var(--ink);background:var(--bg);
  display:grid;grid-template-rows:auto 1fr auto;height:100vh;height:100dvh;
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;
  padding:10px 16px;background:var(--sheet);border-bottom:1px solid var(--rule);
}
.name{display:flex;align-items:baseline;gap:2px;flex:1 1 240px;min-width:0}
.name input{
  font:inherit;font-size:16px;font-weight:600;color:var(--ink);
  background:transparent;border:1px solid transparent;border-radius:4px;
  padding:6px 8px;min-width:0;width:100%;max-width:22em;
}
.name input:hover{border-color:var(--rule)}
.name span{color:var(--muted);font-size:14px}

.actions{display:flex;flex-wrap:wrap;gap:8px}
button{
  font:inherit;font-size:14px;color:var(--ink);background:var(--sheet);
  border:1px solid var(--rule);border-radius:4px;padding:7px 14px;cursor:pointer;
}
button:hover{background:var(--accent-soft);border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#27367A}

.tabs{display:none}
.tabs button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

main{display:grid;grid-template-columns:1fr 1fr;min-height:0}
#editor{
  display:block;width:100%;height:100%;resize:none;border:0;outline:none;
  background:var(--sheet);color:var(--ink);
  font-family:var(--mono);font-size:15px;line-height:1.85;
  padding:28px 32px 80px;tab-size:2;
}
#editor:focus{box-shadow:inset 0 2px 0 var(--accent)}
#editor::placeholder{color:var(--muted)}
#preview-pane{overflow:auto;background:var(--pane);border-left:1px solid var(--rule);min-height:0}
#preview-pane .article{max-width:40rem;margin:0 auto;padding:36px 32px 96px}
.empty{color:var(--muted);font-family:var(--ui);font-size:14px;line-height:1.7}

footer{
  display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 24px;
  padding:7px 16px;background:var(--sheet);border-top:1px solid var(--rule);
  font-size:12.5px;color:var(--muted);
}

#toast{
  position:fixed;left:50%;bottom:52px;transform:translate(-50%,8px);
  background:var(--ink);color:#fff;font-size:14px;padding:9px 18px;border-radius:4px;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:calc(100vw - 32px);
}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:820px){
  .tabs{display:flex;gap:8px}
  main{grid-template-columns:1fr}
  #preview-pane{border-left:0}
  body[data-view="edit"] #preview-pane{display:none}
  body[data-view="preview"] #editor{display:none}
  #editor{font-size:16px;padding:20px 18px 80px}
  #preview-pane .article{padding:24px 18px 80px}
}
@media (prefers-reduced-motion:reduce){
  #toast{transition:none}
}
</style>
</head>

<body data-view="edit">
<header>
  <div class="name">
    <input id="filename" type="text" value="無題" aria-label="ファイル名" spellcheck="false" autocomplete="off">
    <span>.md</span>
  </div>
  <div class="tabs" role="group" aria-label="表示の切り替え">
    <button type="button" id="tab-edit" aria-pressed="true">編集</button>
    <button type="button" id="tab-preview" aria-pressed="false">プレビュー</button>
  </div>
  <div class="actions">
    <button type="button" id="btn-new">新規</button>
    <button type="button" id="btn-open">開く</button>
    <button type="button" id="btn-save" class="primary">保存</button>
    <button type="button" id="btn-html">HTML書き出し</button>
  </div>
  <input id="file-input" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
</header>

<main>
  <textarea id="editor" placeholder="ここに書き始めてください" spellcheck="false" aria-label="Markdownの入力欄"></textarea>
  <div id="preview-pane" aria-label="プレビュー">
    <article id="preview" class="article"></article>
  </div>
</main>

<footer>
  <span id="file-state"></span>
  <span id="stat" title="400字詰め原稿用紙に換算した枚数です"></span>
</footer>

<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
(function () {
  'use strict';

  var STORE_KEY = 'md-editor:v1';
  var SAMPLE = [
    '# はじめに',
    '',
    '左の欄に書くと、右にすぐ表示されます。',
    '',
    '## 書き方の例',
    '',
    '- **太字** は `Ctrl / ⌘ + B`、*斜体* は `Ctrl / ⌘ + I`',
    '- 箇条書きは行頭に `-` を付けます',
    '- 文章の一部を [リンク](https://example.com) にもできます',
    '',
    '> 引用は行頭に `>` を付けます。',
    '',
    '## 保存について',
    '',
    '上の「保存」で `.md` ファイル、「HTML書き出し」で公開用のHTMLが手に入ります。',
    '書いた内容は、このブラウザにも自動で残ります。',
    ''
  ].join('\n');

  var $ = function (s) { return document.querySelector(s); };
  var editor = $('#editor');
  var preview = $('#preview');
  var pane = $('#preview-pane');
  var nameInput = $('#filename');
  var fileState = $('#file-state');
  var stat = $('#stat');
  var toast = $('#toast');
  var fileInput = $('#file-input');

  var dirty = false;      // ファイルとして未保存の変更があるか
  var storageOk = true;   // ブラウザへの自動保存が使えるか
  var renderQueued = false;
  var persistTimer = null;
  var toastTimer = null;

  /* ---------- Markdown 変換 ---------- */
  var libsReady = (typeof window.marked !== 'undefined') && (typeof window.DOMPurify !== 'undefined');
  if (libsReady) {
    marked.use({ gfm: true, breaks: true });
    DOMPurify.addHook('afterSanitizeAttributes', function (node) {
      if (node.tagName === 'A' && node.getAttribute('href')) {
        node.setAttribute('target', '_blank');
        node.setAttribute('rel', 'noopener noreferrer');
      }
    });
  }

  function render() {
    renderQueued = false;
    if (!libsReady) {
      preview.innerHTML = '<p class="empty">プレビューに必要なライブラリを読み込めませんでした。ネットワーク接続を確認して、ページを再読み込みしてください。</p>';
      return;
    }
    if (!editor.value.trim()) {
      preview.innerHTML = '<p class="empty">左の欄にMarkdownを書くと、ここに表示されます。</p>';
      return;
    }
    preview.innerHTML = DOMPurify.sanitize(marked.parse(editor.value));
  }

  function queueRender() {
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(render);
  }

  /* ---------- 表示の更新 ---------- */
  function updateStat() {
    var n = Array.from(editor.value.replace(/\s/g, '')).length;
    var sheets = n / 400;
    stat.textContent = n.toLocaleString('ja-JP') + '文字（空白・改行を除く） / 原稿用紙 約' + sheets.toFixed(1) + '枚';
  }

  function updateState() {
    var text = dirty ? 'ファイルには未保存の変更があります' : 'ファイルに保存済みです';
    if (!storageOk) text += '（このブラウザへの自動保存は使えません）';
    fileState.textContent = text;
  }

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2200);
  }

  /* ---------- ブラウザへの自動保存 ---------- */
  function persist() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        text: editor.value,
        name: nameInput.value,
        dirty: dirty
      }));
      storageOk = true;
    } catch (e) {
      storageOk = false;
    }
    updateState();
  }

  function queuePersist() {
    clearTimeout(persistTimer);
    persistTimer = setTimeout(persist, 400);
  }

  function restore() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var data = JSON.parse(raw);
        if (data && typeof data.text === 'string') {
          editor.value = data.text;
          nameInput.value = data.name || '無題';
          dirty = !!data.dirty;
          return;
        }
      }
    } catch (e) {
      storageOk = false;
    }
    editor.value = SAMPLE;
    nameInput.value = '無題';
    dirty = false;
  }

  /* ---------- ファイル操作 ---------- */
  function getName() {
    var n = nameInput.value.replace(/[\\\/:*?"<>|]/g, '_').trim();
    return n || '無題';
  }

  function download(filename, content, mime) {
    var blob = new Blob([content], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function saveMarkdown() {
    download(getName() + '.md', editor.value, 'text/markdown;charset=utf-8');
    dirty = false;
    persist();
    showToast('保存しました');
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function buildHtml() {
    var tokens = document.getElementById('tokens').textContent;
    var css = document.getElementById('article-css').textContent;
    return '<!DOCTYPE html>\n<html lang="ja">\n<head>\n' +
      '<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      '<title>' + escapeHtml(getName()) + '</title>\n' +
      '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
      '<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@400;500&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">\n' +
      '<style>\n' + tokens + '\n' + css + '\n' +
      'body{margin:0;background:var(--sheet)}\n' +
      '.article{max-width:42rem;margin:0 auto;padding:48px 24px 96px}\n' +
      '</style>\n</head>\n<body>\n<article class="article">\n' +
      preview.innerHTML + '\n</article>\n</body>\n</html>\n';
  }

  function exportHtml() {
    if (!libsReady || !editor.value.trim()) {
      showToast('書き出す内容がありません');
      return;
    }
    render();
    download(getName() + '.html', buildHtml(), 'text/html;charset=utf-8');
    showToast('書き出しました');
  }

  function confirmDiscard(message) {
    return !dirty || window.confirm(message);
  }

  function newDocument() {
    if (!confirmDiscard('ファイルに保存していない変更があります。新規作成すると、現在の内容は消えます。続けますか？')) return;
    editor.value = '';
    nameInput.value = '無題';
    dirty = false;
    refresh();
    persist();
    editor.focus();
  }

  function loadFile(file) {
    if (!file) return;
    if (!confirmDiscard('ファイルに保存していない変更があります。開くと、現在の内容は置き換わります。続けますか？')) return;
    file.text().then(function (text) {
      editor.value = text;
      nameInput.value = file.name.replace(/\.(md|markdown|txt)$/i, '');
      dirty = false;
      refresh();
      persist();
      showToast('開きました');
    }).catch(function () {
      showToast('ファイルを読み込めませんでした。テキスト形式のファイルか確認してください。');
    });
  }

  /* ---------- 入力操作 ---------- */
  function refresh() {
    queueRender();
    updateStat();
  }

  function replaceSelection(text, caretBack) {
    editor.focus();
    var ok = false;
    try { ok = document.execCommand('insertText', false, text); } catch (e) { ok = false; }
    if (!ok) {
      editor.setRangeText(text, editor.selectionStart, editor.selectionEnd, 'end');
      editor.dispatchEvent(new Event('input', { bubbles: true }));
    }
    if (caretBack) {
      var p = editor.selectionEnd - caretBack;
      editor.setSelectionRange(p, p);
    }
  }

  function wrapSelection(mark) {
    var s = editor.selectionStart;
    var e = editor.selectionEnd;
    var sel = editor.value.slice(s, e);
    replaceSelection(mark + sel + mark, sel ? 0 : mark.length);
  }

  editor.addEventListener('input', function () {
    dirty = true;
    refresh();
    updateState();
    queuePersist();
  });

  nameInput.addEventListener('input', function () {
    dirty = true;
    updateState();
    queuePersist();
  });

  editor.addEventListener('scroll', function () {
    var eMax = editor.scrollHeight - editor.clientHeight;
    var pMax = pane.scrollHeight - pane.clientHeight;
    if (eMax > 0 && pMax > 0) pane.scrollTop = pMax * (editor.scrollTop / eMax);
  });

  document.addEventListener('keydown', function (ev) {
    if (!(ev.ctrlKey || ev.metaKey)) return;
    var k = ev.key.toLowerCase();
    if (k === 's') {
      ev.preventDefault();
      saveMarkdown();
    } else if (k === 'b' && document.activeElement === editor) {
      ev.preventDefault();
      wrapSelection('**');
    } else if (k === 'i' && document.activeElement === editor) {
      ev.preventDefault();
      wrapSelection('*');
    }
  });

  /* ---------- ボタン・ドラッグ&ドロップ ---------- */
  $('#btn-new').addEventListener('click', newDocument);
  $('#btn-open').addEventListener('click', function () { fileInput.click(); });
  $('#btn-save').addEventListener('click', saveMarkdown);
  $('#btn-html').addEventListener('click', exportHtml);

  fileInput.addEventListener('change', function () {
    loadFile(fileInput.files[0]);
    fileInput.value = '';
  });

  editor.addEventListener('dragover', function (ev) { ev.preventDefault(); });
  editor.addEventListener('drop', function (ev) {
    var f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
    if (!f) return;
    ev.preventDefault();
    if (/\.(md|markdown|txt)$/i.test(f.name) || (f.type || '').indexOf('text/') === 0) {
      loadFile(f);
    } else {
      showToast('.md または .txt のファイルをドロップしてください');
    }
  });

  /* ---------- 画面幅が狭いときの切り替え ---------- */
  function setView(view) {
    document.body.setAttribute('data-view', view);
    $('#tab-edit').setAttribute('aria-pressed', String(view === 'edit'));
    $('#tab-preview').setAttribute('aria-pressed', String(view === 'preview'));
    if (view === 'preview') render();
  }
  $('#tab-edit').addEventListener('click', function () { setView('edit'); });
  $('#tab-preview').addEventListener('click', function () { setView('preview'); });

  /* ---------- 起動 ---------- */
  restore();
  refresh();
  updateState();
})();
</script>
</body>
</html>
