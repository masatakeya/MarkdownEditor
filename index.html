<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Markdownエディタ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@400;500&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">

<style id="tokens">
:root{
  color-scheme:light dark;
  --bg:#E6E9ED;
  --sheet:#FCFCFD;
  --pane:#F3F4F6;
  --ink:#1E2733;
  --muted:#5B6776;
  --rule:#C6CDD6;
  --accent:#31438A;
  --accent-strong:#27367A;
  --accent-on:#FFFFFF;
  --accent-soft:#E3E7F4;
  --quote-ink:#2A3550;
  --code:#E8EBF0;
  --ui:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,system-ui,sans-serif;
  --serif:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --mono:"M PLUS 1 Code","SFMono-Regular",Consolas,"Hiragino Sans",monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#15181D;
    --sheet:#1C2027;
    --pane:#181B21;
    --ink:#DDE3EA;
    --muted:#98A3B2;
    --rule:#39414D;
    --accent:#93A8EA;
    --accent-strong:#AFBEF2;
    --accent-on:#141821;
    --accent-soft:#232A3A;
    --quote-ink:#C7D1E6;
    --code:#242A33;
  }
}
</style>

<style id="article-css">
.article{font-family:var(--serif);font-size:16px;line-height:1.95;color:var(--ink);overflow-wrap:anywhere}
.article > :first-child{margin-top:0}
.article h1,.article h2,.article h3,.article h4{line-height:1.5;font-weight:700;margin:2em 0 .6em;scroll-margin-top:1em}
.article h1{font-size:1.7em}
.article h2{font-size:1.35em;padding-bottom:.25em;border-bottom:1px solid var(--rule)}
.article h3{font-size:1.15em}
.article h4{font-size:1em}
.article p{margin:0 0 1.1em}
.article ul,.article ol{padding-left:1.6em;margin:0 0 1.1em}
.article li{margin:.2em 0}
.article blockquote{margin:1.2em 0;padding:.1em 1.2em;border-left:3px solid var(--accent);background:var(--accent-soft);color:var(--quote-ink)}
.article blockquote p{margin:.6em 0}
.article code{font-family:var(--mono);font-size:.88em;background:var(--code);padding:.1em .35em;border-radius:3px}
.article pre{background:var(--code);padding:14px 16px;border-radius:4px;overflow-x:auto;line-height:1.6;margin:0 0 1.2em}
.article pre code{background:none;padding:0;font-size:.85em}
.article table{border-collapse:collapse;display:block;max-width:100%;overflow-x:auto;margin:0 0 1.2em}
.article th,.article td{border:1px solid var(--rule);padding:.4em .8em;text-align:left}
.article th{background:var(--code)}
.article img{max-width:100%;height:auto}
.article hr{border:0;border-top:1px solid var(--rule);margin:2em 0}
.article a{color:var(--accent);text-underline-offset:.2em}
.article input[type=checkbox]{margin-right:.4em}
.article .toc{font-family:var(--ui);font-size:.9em;line-height:1.8;margin:0 0 2.2em;padding:.9em 1.3em;background:var(--code);border-radius:4px}
.article .toc-title{margin:0 0 .4em;font-weight:700}
.article .toc ul{margin:0;padding-left:1.3em}
.article .toc li{margin:.1em 0}
</style>

<style id="print-css">
@media print{
  .article{max-width:none;font-size:10.5pt;line-height:1.7;color:#000}
  .article a{color:inherit;text-decoration:underline}
  .article pre,.article blockquote,.article table,.article img{break-inside:avoid}
  .article h1,.article h2,.article h3,.article h4{break-after:avoid}
  .article pre{background:none;border:1px solid #999}
  .article code{background:none}
  .article .toc{display:none}
}
</style>

<style id="app-css">
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--ui);color:var(--ink);background:var(--bg);
  display:grid;grid-template-rows:auto auto 1fr auto;height:100vh;height:100dvh;
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;
  padding:10px 16px;background:var(--sheet);border-bottom:1px solid var(--rule);
}
.name{display:flex;align-items:baseline;gap:2px;flex:1 1 240px;min-width:0}
.name input{
  font:inherit;font-size:16px;font-weight:600;color:var(--ink);
  background:transparent;border:1px solid transparent;border-radius:4px;
  padding:6px 8px;min-width:0;width:100%;max-width:22em;
}
.name input:hover{border-color:var(--rule)}
.name span{color:var(--muted);font-size:14px}

.actions{display:flex;flex-wrap:wrap;gap:8px}
button{
  font:inherit;font-size:14px;color:var(--ink);background:var(--sheet);
  border:1px solid var(--rule);border-radius:4px;padding:7px 14px;cursor:pointer;
}
button:hover{background:var(--accent-soft);border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-on)}
button.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}

.tabs{display:none}
.tabs button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

.toolbar{
  display:flex;flex-wrap:wrap;align-items:center;gap:6px;
  padding:6px 16px;background:var(--sheet);border-bottom:1px solid var(--rule);
}
.toolbar button{font-size:13px;padding:5px 11px;min-width:38px;line-height:1.4}
.toolbar .sep{width:1px;height:18px;background:var(--rule);margin:0 3px}

main{display:grid;grid-template-columns:1fr 1fr;min-height:0}
#editor{
  display:block;width:100%;height:100%;resize:none;border:0;outline:none;
  background:var(--sheet);color:var(--ink);
  font-family:var(--mono);font-size:15px;line-height:1.85;
  padding:28px 32px 80px;tab-size:2;
}
#editor:focus{box-shadow:inset 0 2px 0 var(--accent)}
#editor::placeholder{color:var(--muted)}
#preview-pane{overflow:auto;background:var(--pane);border-left:1px solid var(--rule);min-height:0}
#preview-pane .article{max-width:40rem;margin:0 auto;padding:36px 32px 96px}
.empty{color:var(--muted);font-family:var(--ui);font-size:14px;line-height:1.7}

footer{
  display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 24px;
  padding:7px 16px;background:var(--sheet);border-top:1px solid var(--rule);
  font-size:12.5px;color:var(--muted);
}

#toast{
  position:fixed;left:50%;bottom:52px;transform:translate(-50%,8px);
  background:var(--ink);color:var(--sheet);font-size:14px;padding:9px 18px;border-radius:4px;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:calc(100vw - 32px);
}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:820px){
  .tabs{display:flex;gap:8px}
  main{grid-template-columns:1fr}
  #preview-pane{border-left:0}
  body[data-view="edit"] #preview-pane{display:none}
  body[data-view="preview"] #editor{display:none}
  #editor{font-size:16px;padding:20px 18px 80px}
  #preview-pane .article{padding:24px 18px 80px}
  /* 保存先の指定は狭い画面では使えないため、ヘッダーを詰める */
  #btn-saveas{display:none}
  .toolbar{padding:7px 12px;gap:6px}
  .toolbar button{padding:9px 11px;min-width:40px}
  body[data-view="preview"] .toolbar{display:none}
}
@media (prefers-reduced-motion:reduce){
  #toast{transition:none}
}
@media print{
  body{display:block;height:auto;background:#fff}
  header,footer,#toast,#editor,.toolbar{display:none !important}
  main{display:block}
  #preview-pane,body[data-view="edit"] #preview-pane{display:block !important;overflow:visible;border-left:0;background:#fff}
  #preview-pane .article{max-width:none;margin:0;padding:0}
}
</style>
</head>

<body data-view="edit">
<header>
  <div class="name">
    <input id="filename" type="text" value="無題" aria-label="ファイル名" spellcheck="false" autocomplete="off">
    <span>.md</span>
  </div>
  <div class="tabs" role="group" aria-label="表示の切り替え">
    <button type="button" id="tab-edit" aria-pressed="true">編集</button>
    <button type="button" id="tab-preview" aria-pressed="false">プレビュー</button>
  </div>
  <div class="actions">
    <button type="button" id="btn-new">新規</button>
    <button type="button" id="btn-open">開く</button>
    <button type="button" id="btn-save" class="primary">保存</button>
    <button type="button" id="btn-saveas">名前を付けて保存</button>
    <button type="button" id="btn-html">HTML書き出し</button>
  </div>
  <input id="file-input" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
</header>

<div class="toolbar" id="toolbar" role="toolbar" aria-label="書式">
  <button type="button" data-cmd="h1" title="大見出し">H1</button>
  <button type="button" data-cmd="h2" title="中見出し">H2</button>
  <button type="button" data-cmd="h3" title="小見出し">H3</button>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" data-cmd="ul" title="箇条書き">箇条書き</button>
  <button type="button" data-cmd="ol" title="番号付きリスト">番号</button>
  <button type="button" data-cmd="quote" title="引用">引用</button>
  <button type="button" data-cmd="table" title="表を挿入">表</button>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" data-cmd="bold" title="太字（Ctrl / ⌘ + B）"><strong>B</strong></button>
  <button type="button" data-cmd="italic" title="斜体（Ctrl / ⌘ + I）"><em>I</em></button>
</div>

<main>
  <textarea id="editor" placeholder="ここに書き始めてください" spellcheck="false" aria-label="Markdownの入力欄"></textarea>
  <div id="preview-pane" aria-label="プレビュー">
    <article id="preview" class="article"></article>
  </div>
</main>

<footer>
  <span id="file-state"></span>
  <span id="stat" title="400字詰め原稿用紙に換算した枚数です"></span>
</footer>

<div id="toast" role="status" aria-live="polite"></div>

</script>
<script>
(function () {
  'use strict';

  var STORE_KEY = 'md-editor:v1';
  var BROKEN_KEY = 'md-editor:v1:broken';
  var MAX_IMAGE = 4 * 1024 * 1024;

  var SAMPLE = [
    '# はじめに',
    '',
    '左の欄に書くと、右にすぐ表示されます。',
    '',
    '## 書き方の例',
    '',
    '- **太字** は `Ctrl / ⌘ + B`、*斜体* は `Ctrl / ⌘ + I`',
    '- 箇条書きの行で改行すると、次の行にも `-` が続きます',
    '- 行頭で `Tab` を押すと字下げ、`Shift + Tab` で戻ります',
    '- 文章の一部を [リンク](https://example.com) にもできます',
    '',
    '> 引用は行頭に `>` を付けます。',
    '',
    '## 保存について',
    '',
    '上の「保存」で `.md` ファイル、「HTML書き出し」で公開用のHTMLが手に入ります。',
    '書いた内容は、このブラウザにも自動で残ります。',
    ''
  ].join('\n');

  var $ = function (s) { return document.querySelector(s); };
  var editor = $('#editor');
  var preview = $('#preview');
  var pane = $('#preview-pane');
  var nameInput = $('#filename');
  var fileState = $('#file-state');
  var stat = $('#stat');
  var toast = $('#toast');
  var fileInput = $('#file-input');

  var dirty = false;       // ファイルとして未保存の変更があるか
  var savedOnce = false;   // 一度でもファイルに保存したか
  var storageOk = true;    // ブラウザへの自動保存が使えるか
  var recovered = false;   // 前回のデータが壊れていたか
  var composing = false;   // 日本語入力の変換中か
  var fileHandle = null;   // File System Access API のファイル参照
  var renderQueued = false;
  var persistTimer = null;
  var toastTimer = null;

  var CAN_SAVE_AS = (typeof window.showSaveFilePicker === 'function');
  var CAN_OPEN = (typeof window.showOpenFilePicker === 'function');
  var MD_TYPES = [{ description: 'Markdown', accept: { 'text/markdown': ['.md', '.markdown'], 'text/plain': ['.txt'] } }];

  /* ---------- Markdown 変換 ---------- */
  var libsReady = (typeof window.marked !== 'undefined') && (typeof window.DOMPurify !== 'undefined');
  if (libsReady) {
    marked.use({ gfm: true, breaks: true });
    DOMPurify.addHook('afterSanitizeAttributes', function (node) {
      if (node.tagName === 'A' && node.getAttribute('href')) {
        node.setAttribute('target', '_blank');
        node.setAttribute('rel', 'noopener noreferrer');
      }
    });
  }

  // 見出しに id を振る。marked 12 は既定で id を付けないため、
  // 書き出したHTMLの目次やアンカーのために自前で付ける。
  function slugify(text) {
    var s = text.trim().toLowerCase()
      .replace(/[\s　]+/g, '-')
      .replace(/[^0-9a-z_À-ɏ぀-ヿ㐀-鿿ｦ-ﾟ-]/g, '');
    return s || 'section';
  }

  function addHeadingIds(root) {
    var used = {};
    var hs = root.querySelectorAll('h1,h2,h3,h4,h5,h6');
    for (var i = 0; i < hs.length; i++) {
      var base = slugify(hs[i].textContent);
      var id = base;
      var n = 2;
      while (used[id]) { id = base + '-' + n; n++; }
      used[id] = true;
      hs[i].id = id;
    }
  }

  function render() {
    renderQueued = false;
    if (!libsReady) {
      preview.innerHTML = '<p class="empty">プレビューに必要なライブラリを読み込めませんでした。ページを再読み込みしてください。</p>';
      return;
    }
    if (!editor.value.trim()) {
      preview.innerHTML = '<p class="empty">左の欄にMarkdownを書くと、ここに表示されます。</p>';
      return;
    }
    preview.innerHTML = DOMPurify.sanitize(marked.parse(editor.value));
    addHeadingIds(preview);
  }

  function queueRender() {
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(render);
  }

  /* ---------- 表示の更新 ---------- */
  function updateStat() {
    var n = Array.from(editor.value.replace(/\s/g, '')).length;
    var sheets = n / 400;
    stat.textContent = n.toLocaleString('ja-JP') + '文字（空白・改行を除く） / 原稿用紙 約' + sheets.toFixed(1) + '枚';
  }

  function updateState() {
    var where = fileHandle ? '「' + fileHandle.name + '」' : 'ファイル';
    var text;
    if (dirty) text = where + 'に未保存の変更があります';
    else if (!savedOnce) text = 'まだファイルに保存していません';
    else text = where + 'に保存済みです';
    if (!storageOk) text += '（このブラウザへの自動保存は使えません）';
    fileState.textContent = text;
  }

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2200);
  }

  /* ---------- ブラウザへの自動保存 ---------- */
  function persist() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        text: editor.value,
        name: nameInput.value,
        dirty: dirty,
        savedOnce: savedOnce
      }));
      storageOk = true;
    } catch (e) {
      storageOk = false;
    }
    updateState();
  }

  function queuePersist() {
    clearTimeout(persistTimer);
    persistTimer = setTimeout(persist, 400);
  }

  function restore() {
    var raw = null;
    try {
      raw = localStorage.getItem(STORE_KEY);
    } catch (e) {
      storageOk = false;
    }

    if (raw) {
      var data = null;
      try { data = JSON.parse(raw); } catch (e) { data = null; }
      if (data && typeof data.text === 'string') {
        editor.value = data.text;
        nameInput.value = data.name || '無題';
        dirty = !!data.dirty;
        savedOnce = !!data.savedOnce;
        return;
      }
      // 壊れていた場合、元のデータは退避して残す（上書きして失わせない）
      try { localStorage.setItem(BROKEN_KEY, raw); } catch (e) { /* 退避できなくても続行 */ }
      recovered = true;
      editor.value = '';
      nameInput.value = '無題';
      return;
    }

    editor.value = SAMPLE;
    nameInput.value = '無題';
  }

  /* ---------- ファイル操作 ---------- */
  function getName() {
    var n = nameInput.value.replace(/[\\\/:*?"<>|]/g, '_').trim();
    return n || '無題';
  }

  function stripExt(name) {
    return name.replace(/\.(md|markdown|txt)$/i, '');
  }

  function download(filename, content, mime) {
    var blob = new Blob([content], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function afterSave() {
    dirty = false;
    savedOnce = true;
    persist();
    updateState();
    showToast('保存しました');
  }

  function writeHandle(handle, text) {
    return handle.createWritable().then(function (w) {
      return w.write(text).then(function () { return w.close(); });
    });
  }

  function ensureWritable(handle) {
    if (typeof handle.queryPermission !== 'function') return Promise.resolve(true);
    return handle.queryPermission({ mode: 'readwrite' }).then(function (p) {
      if (p === 'granted') return true;
      return handle.requestPermission({ mode: 'readwrite' }).then(function (r) { return r === 'granted'; });
    });
  }

  function downloadMarkdown() {
    download(getName() + '.md', editor.value, 'text/markdown;charset=utf-8');
    afterSave();
  }

  // 「保存」: 開いているファイルがあればそこへ上書き、なければ保存先を尋ねる
  function saveMarkdown() {
    if (!fileHandle) { saveMarkdownAs(); return; }
    ensureWritable(fileHandle).then(function (ok) {
      if (!ok) {
        showToast('ファイルへの書き込みが許可されませんでした');
        return;
      }
      return writeHandle(fileHandle, editor.value).then(afterSave);
    }).catch(function () {
      showToast('保存できませんでした。ダウンロードで保存します');
      downloadMarkdown();
    });
  }

  function saveMarkdownAs() {
    if (!CAN_SAVE_AS) { downloadMarkdown(); return; }
    window.showSaveFilePicker({ suggestedName: getName() + '.md', types: MD_TYPES }).then(function (handle) {
      fileHandle = handle;
      nameInput.value = stripExt(handle.name);
      return writeHandle(handle, editor.value).then(afterSave);
    }).catch(function (err) {
      if (err && err.name === 'AbortError') return;
      downloadMarkdown();
    });
  }

  function cssSafe(css) {
    // CSSでは \/ が / のエスケープとして有効なので、HTMLパーサに
    // <style> の終わりと誤解させずに済む
    return css.replace(/<\/(style|script)/gi, '<\\/$1');
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function buildToc(root) {
    var hs = root.querySelectorAll('h2,h3');
    if (hs.length < 3) return '';
    var items = '<ul>';
    var sub = false;
    for (var i = 0; i < hs.length; i++) {
      var isSub = (hs[i].tagName === 'H3');
      if (isSub && !sub) { items += '<ul>'; sub = true; }
      if (!isSub && sub) { items += '</ul>'; sub = false; }
      items += '<li><a href="#' + encodeURIComponent(hs[i].id) + '">' + escapeHtml(hs[i].textContent) + '</a></li>';
    }
    if (sub) items += '</ul>';
    items += '</ul>';
    return '<nav class="toc"><p class="toc-title">目次</p>' + items + '</nav>\n';
  }

  function buildHtml() {
    var tokens = cssSafe(document.getElementById('tokens').textContent);
    var css = cssSafe(document.getElementById('article-css').textContent);
    var printCss = cssSafe(document.getElementById('print-css').textContent);
    return '<!DOCTYPE html>\n<html lang="ja">\n<head>\n' +
      '<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      '<meta name="color-scheme" content="light dark">\n' +
      '<title>' + escapeHtml(getName()) + '</title>\n' +
      '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
      '<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@400;500&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">\n' +
      '<style>\n' + tokens + '\n' + css + '\n' + printCss + '\n' +
      'body{margin:0;background:var(--sheet)}\n' +
      '.article{max-width:42rem;margin:0 auto;padding:48px 24px 96px}\n' +
      '@media print{body{background:#fff}.article{padding:0}}\n' +
      '</style>\n</head>\n<body>\n<article class="article">\n' +
      buildToc(preview) + preview.innerHTML + '\n</article>\n</body>\n</html>\n';
  }

  function exportHtml() {
    if (!libsReady || !editor.value.trim()) {
      showToast('書き出す内容がありません');
      return;
    }
    render();
    download(getName() + '.html', buildHtml(), 'text/html;charset=utf-8');
    showToast('書き出しました');
  }

  function confirmDiscard(message) {
    return !dirty || window.confirm(message);
  }

  function newDocument() {
    if (!confirmDiscard('ファイルに保存していない変更があります。新規作成すると、現在の内容は消えます。続けますか？')) return;
    editor.value = '';
    nameInput.value = '無題';
    fileHandle = null;
    dirty = false;
    savedOnce = false;
    refresh();
    persist();
    editor.focus();
  }

  function applyFile(file, handle) {
    return file.text().then(function (text) {
      editor.value = text;
      fileHandle = handle || null;
      nameInput.value = stripExt(file.name);
      dirty = false;
      savedOnce = !!handle;
      refresh();
      persist();
      showToast('開きました');
    }).catch(function () {
      showToast('ファイルを読み込めませんでした。テキスト形式のファイルか確認してください。');
    });
  }

  function openDocument() {
    if (!confirmDiscard('ファイルに保存していない変更があります。開くと、現在の内容は置き換わります。続けますか？')) return;
    if (!CAN_OPEN) { fileInput.click(); return; }
    window.showOpenFilePicker({ types: MD_TYPES, multiple: false }).then(function (handles) {
      var handle = handles[0];
      return handle.getFile().then(function (file) { return applyFile(file, handle); });
    }).catch(function (err) {
      if (err && err.name === 'AbortError') return;
      fileInput.click();
    });
  }

  /* ---------- 画像の埋め込み ---------- */
  function embedImage(file) {
    if (file.size > MAX_IMAGE) {
      showToast('画像が大きすぎます（4MBまで）');
      return;
    }
    var reader = new FileReader();
    reader.onload = function () {
      var alt = stripExt(file.name || '').replace(/[\[\]]/g, '') || '画像';
      replaceSelection('![' + alt + '](' + reader.result + ')');
      showToast('画像を埋め込みました（' + Math.round(file.size / 1024).toLocaleString('ja-JP') + ' KB）');
    };
    reader.onerror = function () { showToast('画像を読み込めませんでした'); };
    reader.readAsDataURL(file);
  }

  /* ---------- 入力操作 ---------- */
  function refresh() {
    queueRender();
    updateStat();
  }

  function replaceSelection(text, caretBack) {
    editor.focus();
    var ok = false;
    try { ok = document.execCommand('insertText', false, text); } catch (e) { ok = false; }
    if (!ok) {
      editor.setRangeText(text, editor.selectionStart, editor.selectionEnd, 'end');
      editor.dispatchEvent(new Event('input', { bubbles: true }));
    }
    if (caretBack) {
      var p = editor.selectionEnd - caretBack;
      editor.setSelectionRange(p, p);
    }
  }

  // 既に囲まれていれば外す（トグル）
  function wrapSelection(mark) {
    var v = editor.value;
    var s = editor.selectionStart;
    var e = editor.selectionEnd;
    var m = mark.length;
    var sel = v.slice(s, e);
    var isItalic = (mark === '*');

    if (sel.length >= 2 * m && sel.slice(0, m) === mark && sel.slice(-m) === mark &&
        !(isItalic && (sel.slice(0, 2) === '**' || sel.slice(-2) === '**'))) {
      replaceSelection(sel.slice(m, sel.length - m));
      return;
    }
    if (s >= m && v.slice(s - m, s) === mark && v.slice(e, e + m) === mark &&
        !(isItalic && (v.slice(s - 2, s) === '**' || v.slice(e, e + 2) === '**'))) {
      editor.setSelectionRange(s - m, e + m);
      replaceSelection(sel);
      return;
    }
    replaceSelection(mark + sel + mark, sel ? 0 : m);
  }

  function indentLines(outdent) {
    var v = editor.value;
    var s = editor.selectionStart;
    var e = editor.selectionEnd;

    if (s === e && !outdent) { replaceSelection('  '); return; }

    var ls = v.lastIndexOf('\n', s - 1) + 1;
    var le = v.indexOf('\n', e);
    if (le < 0) le = v.length;

    var out = v.slice(ls, le).split('\n').map(function (line) {
      return outdent ? line.replace(/^(\t| {1,2})/, '') : '  ' + line;
    }).join('\n');

    editor.setSelectionRange(ls, le);
    replaceSelection(out);
    editor.setSelectionRange(ls, ls + out.length);
  }

  /* ---------- ツールバー ---------- */
  var TABLE_TEMPLATE = [
    '| 見出し1 | 見出し2 | 見出し3 |',
    '| --- | --- | --- |',
    '|  |  |  |',
    '|  |  |  |',
    ''
  ].join('\n');

  // 選択している行（選択がなければカーソル行）をまとめて書き換える
  function eachSelectedLine(transform) {
    var v = editor.value;
    var s = editor.selectionStart;
    var e = editor.selectionEnd;
    var ls = v.lastIndexOf('\n', s - 1) + 1;
    var le = v.indexOf('\n', e);
    if (le < 0) le = v.length;

    var before = v.slice(ls, le);
    var out = transform(before.split('\n')).join('\n');
    editor.setSelectionRange(ls, le);
    replaceSelection(out);

    if (s !== e) {
      editor.setSelectionRange(ls, ls + out.length);   // 選んでいた範囲は選んだまま
    } else {
      // カーソルだけのときは、印の増減ぶんだけずらして戻す
      var p = s + (out.length - before.length);
      if (p < ls) p = ls;
      if (p > ls + out.length) p = ls + out.length;
      editor.setSelectionRange(p, p);
    }
  }

  // 行頭の印（見出し・箇条書き・番号・引用）を付け外しする
  function toggleLinePrefix(kind, level) {
    var test = kind === 'head' ? new RegExp('^\\s*#{' + level + '}\\s')
      : kind === 'ul' ? /^\s*[-*+]\s/
      : kind === 'ol' ? /^\s*\d+[.)]\s/
      : /^\s*>\s/;

    eachSelectedLine(function (lines) {
      var filled = lines.filter(function (l) { return l.trim(); });
      if (!filled.length) filled = lines;
      var already = filled.every(function (l) { return test.test(l); });
      var n = 0;

      return lines.map(function (line) {
        // 複数行を選んでいるときは空行を飛ばす。
        // 1行だけのときは、空行でも印を置いて書き始められるようにする。
        if (!line.trim() && lines.length > 1) return line;
        var indent = /^(\s*)/.exec(line)[1];
        var body = line.slice(indent.length)
          .replace(/^#{1,6}\s+/, '')
          .replace(/^>\s+/, '')
          .replace(/^[-*+]\s+/, '')
          .replace(/^\d+[.)]\s+/, '');
        if (already) return indent + body;
        n++;
        var mark = kind === 'head' ? (new Array(level + 1).join('#') + ' ')
          : kind === 'ul' ? '- '
          : kind === 'ol' ? (n + '. ')
          : '> ';
        return indent + mark + body;
      });
    });
  }

  function insertTable() {
    var v = editor.value;
    var e = editor.selectionEnd;
    var ls = v.lastIndexOf('\n', editor.selectionStart - 1) + 1;
    var onBlankLine = !v.slice(ls, e).trim();
    editor.setSelectionRange(e, e);
    replaceSelection((onBlankLine ? '' : '\n\n') + TABLE_TEMPLATE);
  }

  var COMMANDS = {
    h1: function () { toggleLinePrefix('head', 1); },
    h2: function () { toggleLinePrefix('head', 2); },
    h3: function () { toggleLinePrefix('head', 3); },
    ul: function () { toggleLinePrefix('ul'); },
    ol: function () { toggleLinePrefix('ol'); },
    quote: function () { toggleLinePrefix('quote'); },
    table: insertTable,
    bold: function () { wrapSelection('**'); },
    italic: function () { wrapSelection('*'); }
  };

  // 箇条書き・番号付きリスト・引用を、改行時に引き継ぐ
  function continueBlock(ev) {
    if (editor.selectionStart !== editor.selectionEnd) return;
    var v = editor.value;
    var c = editor.selectionStart;
    var ls = v.lastIndexOf('\n', c - 1) + 1;
    var line = v.slice(ls, c);

    var list = /^(\s*)(?:([-*+])|(\d+)([.)]))(\s+)(\[[ xX]\]\s+)?/.exec(line);
    var quote = /^(\s*)(>+)(\s+)/.exec(line);
    var m = list || quote;
    if (!m) return;

    ev.preventDefault();

    // 中身が空なら、マーカーを消してその段落を終える
    if (!line.slice(m[0].length)) {
      editor.setSelectionRange(ls, c);
      replaceSelection('');
      return;
    }

    if (list) {
      var marker = list[2] ? list[2] : (String(parseInt(list[3], 10) + 1) + list[4]);
      var task = list[6] ? '[ ] ' : '';
      replaceSelection('\n' + list[1] + marker + list[5] + task);
    } else {
      replaceSelection('\n' + quote[1] + quote[2] + quote[3]);
    }
  }

  function onInput() {
    dirty = true;
    if (composing) return;   // 変換中は描画も集計もしない
    refresh();
    updateState();
    queuePersist();
  }

  editor.addEventListener('input', onInput);
  editor.addEventListener('compositionstart', function () { composing = true; });
  editor.addEventListener('compositionend', function () { composing = false; onInput(); });

  nameInput.addEventListener('input', function () {
    dirty = true;
    updateState();
    queuePersist();
  });

  editor.addEventListener('scroll', function () {
    var eMax = editor.scrollHeight - editor.clientHeight;
    var pMax = pane.scrollHeight - pane.clientHeight;
    if (eMax > 0 && pMax > 0) pane.scrollTop = pMax * (editor.scrollTop / eMax);
  });

  editor.addEventListener('keydown', function (ev) {
    if (ev.isComposing || composing) return;
    if (ev.key === 'Enter' && !ev.shiftKey && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
      continueBlock(ev);
    } else if (ev.key === 'Tab' && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
      ev.preventDefault();
      indentLines(ev.shiftKey);
    } else if (ev.key === 'Escape') {
      editor.blur();   // Tab でフォーカスを移したいときの逃げ道
    }
  });

  editor.addEventListener('paste', function (ev) {
    var items = ev.clipboardData && ev.clipboardData.items;
    if (!items) return;
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === 'file' && items[i].type.indexOf('image/') === 0) {
        var f = items[i].getAsFile();
        if (!f) continue;
        ev.preventDefault();
        embedImage(f);
        return;
      }
    }
  });

  document.addEventListener('keydown', function (ev) {
    if (!(ev.ctrlKey || ev.metaKey)) return;
    var k = ev.key.toLowerCase();
    if (k === 's') {
      ev.preventDefault();
      if (ev.shiftKey) saveMarkdownAs(); else saveMarkdown();
    } else if (k === 'b' && document.activeElement === editor) {
      ev.preventDefault();
      wrapSelection('**');
    } else if (k === 'i' && document.activeElement === editor) {
      ev.preventDefault();
      wrapSelection('*');
    }
  });

  /* ---------- ボタン・ドラッグ&ドロップ ---------- */
  $('#btn-new').addEventListener('click', newDocument);
  $('#btn-open').addEventListener('click', openDocument);
  $('#btn-save').addEventListener('click', saveMarkdown);
  $('#btn-saveas').addEventListener('click', saveMarkdownAs);
  $('#btn-html').addEventListener('click', exportHtml);

  var toolbar = $('#toolbar');
  // ボタンを押しても入力欄からフォーカスと選択範囲を奪わない
  toolbar.addEventListener('mousedown', function (ev) {
    if (ev.target.closest('button')) ev.preventDefault();
  });
  toolbar.addEventListener('click', function (ev) {
    var btn = ev.target.closest('button');
    if (!btn) return;
    var cmd = COMMANDS[btn.getAttribute('data-cmd')];
    if (cmd) cmd();
  });

  fileInput.addEventListener('change', function () {
    var f = fileInput.files[0];
    fileInput.value = '';
    if (f) applyFile(f, null);
  });

  editor.addEventListener('dragover', function (ev) { ev.preventDefault(); });
  editor.addEventListener('drop', function (ev) {
    var f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
    if (!f) return;
    ev.preventDefault();
    if ((f.type || '').indexOf('image/') === 0) {
      embedImage(f);
    } else if (/\.(md|markdown|txt)$/i.test(f.name) || (f.type || '').indexOf('text/') === 0) {
      if (!confirmDiscard('ファイルに保存していない変更があります。開くと、現在の内容は置き換わります。続けますか？')) return;
      applyFile(f, null);
    } else {
      showToast('.md / .txt または画像ファイルをドロップしてください');
    }
  });

  /* ---------- 画面幅が狭いときの切り替え ---------- */
  function setView(view) {
    document.body.setAttribute('data-view', view);
    $('#tab-edit').setAttribute('aria-pressed', String(view === 'edit'));
    $('#tab-preview').setAttribute('aria-pressed', String(view === 'preview'));
    if (view === 'preview') render();
  }
  $('#tab-edit').addEventListener('click', function () { setView('edit'); });
  $('#tab-preview').addEventListener('click', function () { setView('preview'); });

  window.addEventListener('beforeprint', render);

  /* ---------- 起動 ---------- */
  restore();
  refresh();
  updateState();
  if (recovered) {
    showToast('前回の保存データを読み込めませんでした。壊れた内容は別に退避してあります。');
  }
})();
</script>
</body>
</html>
